# Arm: VFL + Dense O2O off (the D-FINE recipe on the DEIM schedule).
__include__: ['../deim_dfine/deim_hgnetv2_n_pets.yml']

output_dir: ./outputs/pets/vfl_plain

DEIMCriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: ['vfl', 'boxes', 'local']
  alpha: 0.75
  gamma: 2.0

train_dataloader:
  dataset:
    transforms:
      mosaic_prob: 0.0
  collate_fn:
    mixup_prob: 0.0
