# Arm: VFL + Dense O2O on.
__include__: ['../deim_dfine/deim_hgnetv2_n_pets.yml']

output_dir: ./outputs/pets/vfl_dense

# VFL with the D-FINE defaults. alpha/gamma must be restored here because
# configs/base/deim.yml sets gamma: 1.5 for MAL and the criterion shares it between both losses.
DEIMCriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: ['vfl', 'boxes', 'local']
  alpha: 0.75
  gamma: 2.0
